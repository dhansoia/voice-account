name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VoiceHisaab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceHisaab-apk
          path: VoiceHisaab.apk

      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          gh release delete latest -y --cleanup-tag || true
          gh release create latest VoiceHisaab.apk --title "Voice Hisaab v$VER (latest)" --notes "Built from ${GITHUB_SHA::7}. Download VoiceHisaab.apk below and install." --latest
